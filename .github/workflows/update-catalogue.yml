name: Update Marvel minifigure catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update catalogue data
        run: python scripts/update_catalogue.py

      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
          else
            git commit -m "Update Marvel minifigure catalogue"
            git push
          fi
